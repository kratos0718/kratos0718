<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.0" r="0.75">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="1.0" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- faint dot texture -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="90"  cy="70"  r="2"/><circle cx="140" cy="70" r="2"/><circle cx="190" cy="70" r="2"/>
    <circle cx="90"  cy="120" r="2"/><circle cx="140" cy="120" r="2"/>
    <circle cx="1110" cy="230" r="2"/><circle cx="1060" cy="230" r="2"/><circle cx="1010" cy="230" r="2"/>
    <circle cx="1110" cy="180" r="2"/><circle cx="1060" cy="180" r="2"/>
  </g>

  <!-- terminal-style tag -->
  <text x="600" y="70" text-anchor="middle" font-size="15" fill="#2dd4bf" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="2">$ whoami</text>

  <!-- name -->
  <text x="600" y="150" text-anchor="middle" font-size="60" font-weight="700" fill="#e6edf3" letter-spacing="1">Abhinav Tarigoppula</text>

  <!-- accent underline -->
  <rect x="525" y="172" width="150" height="4" rx="2" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="600" y="216" text-anchor="middle" font-size="21" fill="#8b949e" letter-spacing="4">AI / ML  ENGINEER  &#8226;  OPEN-SOURCE  CONTRIBUTOR</text>

  <!-- sub-line -->
  <text x="600" y="255" text-anchor="middle" font-size="15" fill="#6e7681" font-family="'SFMono-Regular', Consolas, monospace">codehound  &#183;  18 PRs merged into major AI frameworks  &#183;  IEEE research</text>
</svg>
