<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.0" r="0.8">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="1.0" r="0.65">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.08" cy="1.0" r="0.55">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  <rect width="1200" height="380" fill="url(#glow2)"/>
  <rect width="1200" height="380" fill="url(#glow3)"/>

  <!-- top hairline accent -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#hairline)"/>

  <!-- faint dot texture, corners -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="80"  cy="60"  r="2"/><circle cx="128" cy="60" r="2"/><circle cx="176" cy="60" r="2"/>
    <circle cx="80"  cy="108" r="2"/><circle cx="128" cy="108" r="2"/>
    <circle cx="1120" cy="320" r="2"/><circle cx="1072" cy="320" r="2"/><circle cx="1024" cy="320" r="2"/>
    <circle cx="1120" cy="272" r="2"/><circle cx="1072" cy="272" r="2"/>
  </g>

  <!-- terminal window chrome, top-left -->
  <g transform="translate(48, 44)">
    <circle cx="0"  cy="0" r="5" fill="#ff5f56" opacity="0.55"/>
    <circle cx="18" cy="0" r="5" fill="#ffbd2e" opacity="0.55"/>
    <circle cx="36" cy="0" r="5" fill="#27c93f" opacity="0.55"/>
  </g>

  <!-- terminal-style tag + blinking cursor -->
  <text x="600" y="96" text-anchor="middle" font-size="16" fill="#2dd4bf" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="2">
    $ whoami<tspan opacity="1"> _</tspan>
    <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.5;0.75;1" dur="1.1s" repeatCount="indefinite"/>
  </text>

  <!-- name -->
  <text x="600" y="192" text-anchor="middle" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="0.5">Abhinav Tarigoppula</text>

  <!-- accent underline, subtle width pulse -->
  <rect x="525" y="218" width="150" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="150;190;150" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="525;505;525" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- rotating tagline, 4-phrase crossfade over a 12s loop -->
  <g font-size="22" fill="#9ba7b4" letter-spacing="3" font-family="'SFMono-Regular', Consolas, monospace" text-anchor="middle">
    <text x="600" y="268" opacity="0">
      AI/ML ENGINEER &#183; OPEN-SOURCE CONTRIBUTOR
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.02;0.23;0.25;1" values="0;1;1;0;0"/>
    </text>
    <text x="600" y="268" opacity="0">
      22 PRS MERGED &#183; 13 ORGANIZATIONS &#183; 300K+ STARS
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.25;0.27;0.48;0.50;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="600" y="268" opacity="0">
      AUTHOR OF CODEHOUND &#8226; AST BUG-FINDER FOR AI CODEBASES
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.50;0.52;0.73;0.75;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="600" y="268" opacity="0">
      IEEE ISED 2026 &#183; ACCEPTED RESEARCH PAPER
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.75;0.77;0.98;1" values="0;0;1;1;0"/>
    </text>
  </g>

  <!-- bottom hairline accent -->
  <rect x="0" y="379" width="1200" height="1" fill="url(#hairline)"/>
</svg>
